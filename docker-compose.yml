version: '3.8'

# =====================================================================
# OpsPilot Local Production & Development Orchestration Stack
# Multi-tenant Architecture: Node.js Backend, React/Nginx Frontend,
# PostgreSQL 16, and Redis BullMQ Worker Queue.
# =====================================================================

services:
  # -------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # -------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: opspilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-opspilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opspilot-network

  # -------------------------------------------------------------------
  # 2. Redis Message Broker & Queue Service
  # -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-opspilot_redis_secure_pass}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-opspilot_redis_secure_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opspilot-network

  # -------------------------------------------------------------------
  # 3. Node.js Backend API Service
  # -------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: opspilot-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:5173,http://localhost:80
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-opspilot}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-opspilot_redis_secure_pass}
      SUPABASE_URL: ${SUPABASE_URL:-https://mock-opspilot.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-mock-anon-key-opspilot-2026}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-mock-service-role-key-opspilot-2026}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/v1/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - opspilot-network

  # -------------------------------------------------------------------
  # 4. React Frontend (Nginx Alpine)
  # -------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_SUPABASE_URL: ${SUPABASE_URL:-https://mock-opspilot.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-mock-anon-key-opspilot-2026}
    container_name: opspilot-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - opspilot-network

# ---------------------------------------------------------------------
# Storage Volumes & Networks
# ---------------------------------------------------------------------
volumes:
  pgdata:
    name: opspilot-pgdata
  redisdata:
    name: opspilot-redisdata

networks:
  opspilot-network:
    name: opspilot-network
    driver: bridge
